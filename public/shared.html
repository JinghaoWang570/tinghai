<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听海 · 分享节目</title><style>body{max-width:540px;margin:60px auto;padding:24px;font:16px/1.7 system-ui;background:#f4f8f9;color:#10394d}audio{width:100%}h1{font-size:26px}</style><p>听海 · 分享节目</p><h1 id="title">正在加载…</h1><audio id="audio" controls></audio><p id="status"></p><script>
const id=new URLSearchParams(location.search).get('id'),a=document.getElementById('audio'),status=document.getElementById('status');let urls=[],index=0;
fetch('/__local/share/'+encodeURIComponent(id||'')).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('title').textContent=d.title;urls=d.audio.map(s=>URL.createObjectURL(new Blob([Uint8Array.from(atob(s),c=>c.charCodeAt(0))],{type:'audio/mpeg'})));function load(){a.src=urls[index];status.textContent='第 '+(index+1)+' / '+urls.length+' 段'}load();a.onended=()=>{if(index<urls.length-1){index++;load();a.play().catch(()=>{})}else status.textContent='本期节目已结束'}}).catch(e=>status.textContent=e.message);window.addEventListener('pagehide',()=>urls.forEach(URL.revokeObjectURL));
</script></html>
